<!doctype html><meta charset="utf-8"><title>loader speed check</title>
<body style="margin:0;background:#111;color:#eee;font:14px system-ui">
<pre id="log" style="position:fixed;bottom:0;left:400px;margin:8px"></pre>
<script type="module">
// Runs the real loading window under several network profiles and checks, every animation frame:
// weave = number, never ahead of the bytes, never backwards, no skipped percent, one canvas, "Ready" only after 100%.
const PROFILES = [
  { name: 'Instant (no throttle)', p: null, limit: 30 },
  { name: 'Wi-Fi 50 Mbps, 20 ms', p: { mbps: 50, rtt: 20 }, limit: 40 },
  { name: '4G 9 Mbps, 85 ms', p: { mbps: 9, rtt: 85 }, limit: 130 },
  { name: 'Fast 3G 1.6 Mbps: start', p: { mbps: 1.6, rtt: 150 }, limit: 30 },
  { name: 'Fast 3G 1.6 Mbps: end (from 90%)', p: { mbps: 1.6, rtt: 150, skip: 0.9 }, limit: 60 },
  { name: 'Slow 3G 0.4 Mbps: start', p: { mbps: 0.4, rtt: 400 }, limit: 30 },
  { name: 'Slow 3G 0.4 Mbps: end (from 97.5%)', p: { mbps: 0.4, rtt: 400, skip: 0.975 }, limit: 60 },
  { name: '2G/EDGE 0.25 Mbps: end (from 98.5%)', p: { mbps: 0.25, rtt: 600, skip: 0.985 }, limit: 60 },
  { name: 'Train: 9 / 0.4 / dead zone (from 75%)', p: { schedule: [[5, 9], [5, 0.4], [3, 0]], rtt: 120, skip: 0.75 }, limit: 75 },
  { name: 'Jitter 0.9 + 2 s stalls (from 75%)', p: { mbps: 4, rtt: 100, jitter: 0.9, stallEveryMB: 4, stallMs: 2000, skip: 0.75 }, limit: 75 },
  { name: 'Spikes: 0.5 Mbps with 100 Mbps bursts (from 60%)', p: { schedule: [[4, 0.5], [1, 100]], rtt: 120, skip: 0.6 }, limit: 75 },
  { name: 'Constant 200 Mbps', p: { mbps: 200, rtt: 10 }, limit: 30 },
  { name: 'Connection drops at 25 MB (9 Mbps)', p: { mbps: 9, rtt: 85, dropAtMB: 25 }, limit: 120 },
  { name: 'Drop at 25 MB, Range ignored (like Pages)', p: { mbps: 9, rtt: 85, dropAtMB: 25, noRange: true }, limit: 120 },
];
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const results = [];
// ?only=0,2,13 runs a subset
const only = new URLSearchParams(location.search).get('only')?.split(',');
for (const { name, p, limit } of only ? PROFILES.filter((_, i) => only.includes(String(i))) : PROFILES) {
  await fetch('/__profile', { method: 'POST', body: p ? JSON.stringify(p) : '' });
  localStorage.removeItem('kinthread-model');
  for (const k of await caches.keys()) await caches.delete(k);
  const f = document.createElement('iframe');
  f.src = '/?r=' + Math.random();
  f.style.cssText = 'width:390px;height:844px;border:0;display:block';
  document.body.prepend(f);
  await new Promise((r) => (f.onload = () => setTimeout(r, 2500)));
  const W = f.contentWindow, d = f.contentDocument.querySelector('dialog');
  // the window opens when something asks for the model: an example, like a visitor would
  [...f.contentDocument.querySelectorAll('button')].find((b) => /^Two steps/.test(b.textContent.trim())).click();
  await new Promise((r) => { const t0 = performance.now(); const w = () => (d.open || performance.now() - t0 > 3000 ? r() : requestAnimationFrame(w)); w(); });
  const s = { name, maxLag: 0, rawDone: null, error: 0, retried: 0, frames: 0, mismatch: 0, ahead: 0, backwards: 0, skipped: 0, canvases: new Set(), maxStep: 0, hit100: null, ready: null, readyBefore100: false, labelBack: 0, phase: 0, last: -1, lastW: 0, finished: false };
  const t0 = performance.now();
  await new Promise((done) => {
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      if (!d.open || t > limit) { s.finished = !d.open; done(); return; }
      const cv = d.querySelector('canvas');
      const txt = d.querySelector('[class*=count]')?.textContent || '';
      const m = (d.querySelector('[class*=detail]')?.textContent || '').match(/([\d.]+) of ([\d.]+)/);
      const retry = [...d.querySelectorAll('button')].find((b) => /Try again/.test(b.textContent));
      // label must only move forward: downloading/reconnecting -> checking -> on this device
      const phase = /on this device/.test(d.textContent) ? 2 : /Checking the model/.test(d.textContent) ? 1 : 0;
      if (phase < s.phase) s.labelBack++;
      s.phase = Math.max(s.phase, phase);
      if (retry) { s.error++; if (!s.waitingRetry) { s.waitingRetry = true; setTimeout(() => { s.retried++; s.waitingRetry = false; retry.click(); }, 1000); } }
      if (cv && /%/.test(txt)) {
        s.frames++; s.canvases.add(cv);
        const w = +cv.dataset.weave || 0, n = parseInt(txt, 10), raw = m ? +m[1] / +m[2] : null;
        if (Math.abs(Math.floor(w * 100 + 1e-9) - n) > 1) s.mismatch++;
        if (raw !== null && w > raw + 0.004) s.ahead++;
        if (raw !== null && raw < 1) s.maxLag = Math.max(s.maxLag, raw - w);
        if (raw !== null && raw >= 0.9995 && s.rawDone === null) s.rawDone = t;
        if (w + 1e-6 < s.lastW || n < s.last) s.backwards++;
        if (s.last >= 0 && n - s.last > 1) s.skipped++;
        s.maxStep = Math.max(s.maxStep, w - s.lastW);
        s.lastW = w; s.last = n;
        if (n === 100 && s.hit100 === null) s.hit100 = t;
      }
      if (/Ready/.test(txt) && s.ready === null) { s.ready = t; s.readyBefore100 = s.hit100 === null; }
      W.requestAnimationFrame(tick);
    };
    W.requestAnimationFrame(tick);
  });
  f.remove();
  const r = { ...s, maxLag: +s.maxLag.toFixed(3), endDelay: s.rawDone !== null && s.hit100 !== null ? +(s.hit100 - s.rawDone).toFixed(2) : null, error: s.error > 0, canvases: s.canvases.size, maxStep: +s.maxStep.toFixed(4), hit100: s.hit100 && +s.hit100.toFixed(2), ready: s.ready && +s.ready.toFixed(2), lastPct: s.last };
  delete r.lastW; delete r.last; delete r.rawDone; delete r.waitingRetry;
  results.push(r);
  log(JSON.stringify(r));
}
await fetch('/__profile', { method: 'POST', body: '' });
await fetch('/__result', { method: 'POST', body: JSON.stringify({ loader: results }) });
document.title = 'loader done';
</script>
