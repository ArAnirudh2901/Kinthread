<!doctype html><meta charset="utf-8"><title>export check</title>
<body style="margin:0"><script type="module">
const out = { ua: navigator.userAgent, errors: [] };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = (w) => new Promise((r) => { const f = document.createElement('iframe'); f.src = '/'; f.style.cssText = `width:${w}px;height:900px;border:0`; document.body.appendChild(f); f.onload = () => setTimeout(() => r(f), 3000); });
try {
  const f = await frame(375), win = f.contentWindow, d = f.contentDocument;
  win.addEventListener('error', (e) => out.errors.push(e.message));
  win.addEventListener('unhandledrejection', (e) => out.errors.push(String(e.reason)));
  for (const theme of ['dark', 'light']) {
    if (theme === 'light') { d.documentElement.dataset.theme = 'light'; await wait(400); }
    win.dispatchEvent(new CustomEvent('kinthread:example', { detail: 'exam' }));
    await wait(9000);
    const tb = win.HTMLCanvasElement.prototype.toBlob;
    win.HTMLCanvasElement.prototype.toBlob = function (cb, ...a) { try { win.__png = this.toDataURL('image/png'); } catch (e) { out.errors.push('toDataURL ' + e); } return tb.call(this, cb, ...a); };
    win.HTMLAnchorElement.prototype.click = function () { win.__name = this.download; };
    win.__png = null;
    const btn = d.querySelector('button[aria-label="Download the map as an image"]');
    btn.click();
    const states = [];
    for (let i = 0; i < 40; i++) { await wait(100); if (states.at(-1) !== btn.dataset.state) states.push(btn.dataset.state); }
    let png = null;
    if (win.__png) { const img = new Image(); img.src = win.__png; await img.decode(); png = `${img.naturalWidth}x${img.naturalHeight}`; }
    out[theme] = { blanks: [...d.querySelectorAll('button[data-slot]')].map((b) => b.textContent), head: d.querySelector('h3')?.textContent, states: states.join('>'), file: win.__name, png, fits: !d.querySelector('[data-scroll]'), pageW: d.documentElement.scrollWidth };
  }
} catch (e) { out.errors.push('fatal ' + e); }
await fetch('/__result', { method: 'POST', body: JSON.stringify({ export: out }) });
document.title = 'export done';
</script>
